name: Bake Accra world

on:
  workflow_dispatch:
  push:
    branches: [osm-accra-world]
    paths:
      - "scripts/osm/**"
      - ".github/workflows/bake-accra.yml"

permissions:
  contents: read

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bake Legon to UPSA world
        run: npm run world:bake:accra
      - name: Show world manifest
        run: cat public/world/accra/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: accra-world
          path: public/world/accra
          if-no-files-found: error
          retention-days: 7
